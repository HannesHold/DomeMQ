name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test DomeMQ.sln -c Release --nologo

      - name: Build inspector
        run: dotnet build tools/DomeMQ.Inspector/DomeMQ.Inspector.csproj -c Release --nologo
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1
